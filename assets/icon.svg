<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <!-- AutoPixel icon. 108-unit grid = Android adaptive icon; artwork stays inside the central 66-unit circle.
       Same geometry as assets/make_icons.py (Windows) and android/src/main/res/drawable/ic_launcher_*.xml. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2D57"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <!-- pixels rising into the cloud: PC to Pixel transfer -->
  <rect x="30" y="71.5" width="5" height="5" rx="1" fill="#3B82F6"/>
  <rect x="36.5" y="64.5" width="6.5" height="6.5" rx="1.3" fill="#22B8D6"/>
  <!-- cloud: Google Photos backup -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="51" r="11"/>
    <circle cx="55" cy="42" r="16"/>
    <circle cx="69" cy="52" r="10"/>
    <rect x="40" y="46" width="29" height="16"/>
  </g>
  <!-- check: original-quality backup confirmed -->
  <path fill="none" stroke="#12B886" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"
        d="M46.5,50.5 L53,57 L64.5,45"/>
</svg>
